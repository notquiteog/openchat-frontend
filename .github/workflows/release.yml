name: Release Builds

on:
  release:
    types: [published]

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FLUTTER_VERSION: '3.44.0'
  DART_DEFINES: >-
    --dart-define=OPENCHAT_HOST=openchat.win
    --dart-define=OPENCHAT_PORT=443
    --dart-define=OPENCHAT_HTTPS=true

# ── Shared version extraction ─────────────────────────────────────────────────
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v6.0.2
      - id: v
        run: |
          echo "version=$(grep '^version:' pubspec.yaml \
            | awk '{print $2}' | tr -d '\r')" >> "$GITHUB_OUTPUT"

# ── Android ───────────────────────────────────────────────────────────────────
  build-android:
    name: Android (APK)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release ${{ env.DART_DEFINES }}

      - name: Upload to release
        run: |
          APK="openchat-${{ needs.version.outputs.version }}-android.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          gh release upload "${{ github.ref_name }}" "$APK" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

# ── Windows ───────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (x64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Windows
        run: |
          flutter pub get
          flutter build windows --release ${{ env.DART_DEFINES }}

      - name: Package zip
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $zip     = "openchat-$version-windows-x64.zip"
          Compress-Archive `
            -Path   "build\windows\x64\runner\Release\*" `
            -DestinationPath $zip
          echo "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Upload to release
        run: gh release upload "${{ github.ref_name }}" "${{ env.ZIP }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

# ── Linux ─────────────────────────────────────────────────────────────────────
  build-linux:
    name: Linux (x86_64)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev \
            libjsoncpp-dev libunwind-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Build Linux
        run: |
          flutter pub get
          flutter build linux --release ${{ env.DART_DEFINES }}

      - name: Package tar.gz
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          ARCHIVE="openchat-${VERSION}-linux-x86_64.tar.gz"
          tar -czf "$ARCHIVE" -C build/linux/x64/release/bundle .
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload to release
        run: gh release upload "${{ github.ref_name }}" "${{ env.ARCHIVE }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

# ── macOS ─────────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS (unsigned)
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build macOS (unsigned)
        run: |
          flutter pub get
          flutter build macos --release ${{ env.DART_DEFINES }}

      - name: Package zip
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          ARCHIVE="openchat-${VERSION}-macos-unsigned.zip"
          ditto -c -k --keepParent \
            "build/macos/Build/Products/Release/OpenChat.app" \
            "$ARCHIVE"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload to release
        run: gh release upload "${{ github.ref_name }}" "${{ env.ARCHIVE }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

# ── iOS ───────────────────────────────────────────────────────────────────────
  build-ios:
    name: iOS (unsigned IPA)
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build iOS (no codesign)
        run: |
          flutter pub get
          flutter build ios --release --no-codesign ${{ env.DART_DEFINES }}

      - name: Package IPA
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          IPA="openchat-${VERSION}-ios-unsigned.ipa"
          mkdir -p Payload
          cp -r "build/ios/iphoneos/Runner.app" Payload/
          ditto -c -k --keepParent Payload "$IPA"
          rm -rf Payload
          echo "IPA=${IPA}" >> "$GITHUB_ENV"

      - name: Upload to release
        run: gh release upload "${{ github.ref_name }}" "${{ env.IPA }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

# ── Clear binaries from previous releases (free-tier storage) ─────────────────
  cleanup-old-assets:
    name: Clear previous release binaries
    needs: [build-android, build-windows, build-linux, build-macos, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Delete assets from older releases
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ github.ref_name }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName --jq '.[].tagName' | while read -r tag; do
            [ "$tag" = "$CURRENT" ] && continue
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' | while read -r asset; do
              echo "Deleting $asset from $tag"
              gh release delete-asset "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --yes
            done
          done
