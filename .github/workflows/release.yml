name: Release Builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload artifacts to (e.g. v0.2.1)'
        required: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FLUTTER_VERSION: '3.44.1'
  DART_DEFINES: >-
    --dart-define=OPENCHAT_HOST=openchat.win
    --dart-define=OPENCHAT_PORT=443
    --dart-define=OPENCHAT_HTTPS=true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release_tag: ${{ steps.v.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6.0.2
      - id: v
        run: |
          echo "version=$(grep '^version:' pubspec.yaml \
            | awk '{print $2}' | tr -d '\r')" >> "$GITHUB_OUTPUT"
          echo "release_tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

  build-android:
    name: Android (APK)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Inject Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          : "${GOOGLE_SERVICES_JSON:?GOOGLE_SERVICES_JSON secret is required for Android Firebase notifications}"
          : "${FIREBASE_OPTIONS_DART:?FIREBASE_OPTIONS_DART secret is required for Firebase notifications}"
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          echo "$FIREBASE_OPTIONS_DART" | base64 --decode > lib/firebase_options.dart
          bash tool/validate_firebase_config.sh \
            --firebase-options lib/firebase_options.dart \
            --android-google-services android/app/google-services.json

      - name: Inject Android signing config
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | base64 --decode > /tmp/keystore.jks
            cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=/tmp/keystore.jks
          EOF
          fi

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release ${{ env.DART_DEFINES }}

      - name: Upload to release
        run: |
          APK="openchat-${{ needs.version.outputs.version }}-android.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          gh release upload "${{ needs.version.outputs.release_tag }}" "$APK" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  build-windows:
    name: Windows (x64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Inject Firebase config
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          if [ -n "$FIREBASE_OPTIONS_DART" ]; then
            echo "$FIREBASE_OPTIONS_DART" | base64 --decode > lib/firebase_options.dart
          fi

      - name: Build Windows
        run: |
          flutter pub get
          flutter build windows --release ${{ env.DART_DEFINES }}

      - name: Sign Windows executables
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERTIFICATE) {
            $pfx = "$env:RUNNER_TEMP\openchat.pfx"
            [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE) | Set-Content $pfx -AsByteStream
            $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'x64' } | Select-Object -Last 1).FullName
            Get-ChildItem "build\windows\x64\runner\Release\*.exe" | ForEach-Object {
              & $signtool sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd sha256 /tr http://timestamp.acs.microsoft.com /td sha256 $_.FullName
            }
          }

      - name: Package zip
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $zip     = "openchat-$version-windows-x64.zip"
          Compress-Archive `
            -Path   "build\windows\x64\runner\Release\*" `
            -DestinationPath $zip
          echo "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Upload to release
        run: gh release upload "${{ needs.version.outputs.release_tag }}" "${{ env.ZIP }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  build-linux:
    name: Linux (x86_64)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            clang lld cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libayatana-appindicator3-dev \
            libx11-dev libxi-dev \
            libstdc++-12-dev libunwind-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            desktop-file-utils dpkg-dev flatpak flatpak-builder
          sudo ln -sfn \
            /usr/include/libayatana-appindicator3-0.1/libayatana-appindicator \
            /usr/local/include/libayatana-appindicator

      - name: Inject Firebase config
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          if [ -n "$FIREBASE_OPTIONS_DART" ]; then
            echo "$FIREBASE_OPTIONS_DART" | base64 --decode > lib/firebase_options.dart
          fi

      - name: Build Linux
        env:
          CPATH: /usr/local/include:/usr/include/libayatana-appindicator3-0.1
          LDFLAGS: -fuse-ld=lld
        run: |
          flutter pub get
          flutter build linux --verbose --release ${{ env.DART_DEFINES }}

      - name: Package tar.gz
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          ARCHIVE="openchat-${VERSION}-linux-x86_64.tar.gz"
          tar -czf "$ARCHIVE" -C build/linux/x64/release/bundle .
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Package deb
        run: |
          DEB="$(packaging/linux/build_deb.sh "${{ needs.version.outputs.version }}")"
          echo "DEB=${DEB}" >> "$GITHUB_ENV"

      - name: Package Flatpak
        run: |
          sudo flatpak remote-add --if-not-exists --system flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --system --noninteractive -y flathub org.gnome.Platform//50 org.gnome.Sdk//50
          FLATPAK="$(packaging/linux/build_flatpak.sh "${{ needs.version.outputs.version }}")"
          echo "FLATPAK=${FLATPAK}" >> "$GITHUB_ENV"

      - name: Upload to release
        run: |
          gh release upload "${{ needs.version.outputs.release_tag }}" \
            "${{ env.ARCHIVE }}" \
            "${{ env.DEB }}" \
            "${{ env.FLATPAK }}" \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  build-macos:
    name: macOS (unsigned)
    needs: version
    # connectivity_plus 7.1.x references Apple 26 Network.framework symbols, so
    # this job needs the newer Xcode/macOS SDK available on the macOS 26 image.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show Apple SDK versions
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Inject Firebase config
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          if [ -n "$FIREBASE_OPTIONS_DART" ]; then
            echo "$FIREBASE_OPTIONS_DART" | base64 --decode > lib/firebase_options.dart
          fi

      - name: Build macOS (unsigned)
        run: |
          flutter pub get
          flutter build macos --release ${{ env.DART_DEFINES }}

      - name: Package zip
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          ARCHIVE="openchat-${VERSION}-macos-unsigned.zip"
          ditto -c -k --keepParent \
            "build/macos/Build/Products/Release/OpenChat.app" \
            "$ARCHIVE"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload to release
        run: gh release upload "${{ needs.version.outputs.release_tag }}" "${{ env.ARCHIVE }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  build-ios:
    name: iOS (unsigned IPA)
    needs: version
    # connectivity_plus 7.1.x references Apple 26 Network.framework symbols, so
    # this job needs the newer Xcode/iPhoneOS SDK available on the macOS 26 image.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show Apple SDK versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Inject Firebase config
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          : "${GOOGLE_SERVICE_INFO_PLIST:?GOOGLE_SERVICE_INFO_PLIST secret is required for iOS Firebase notifications}"
          : "${FIREBASE_OPTIONS_DART:?FIREBASE_OPTIONS_DART secret is required for Firebase notifications}"
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
          echo "$FIREBASE_OPTIONS_DART" | base64 --decode > lib/firebase_options.dart
          bash tool/validate_firebase_config.sh \
            --firebase-options lib/firebase_options.dart \
            --ios-google-service-info ios/Runner/GoogleService-Info.plist

      - name: Build iOS (no codesign)
        run: |
          flutter pub get
          cd ios && pod install --repo-update && cd ..
          perl -0pi -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          perl -0pi -e 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "";\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;/g' ios/Runner.xcodeproj/project.pbxproj
          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGNING_REQUIRED=NO
          flutter build ios --release --no-codesign ${{ env.DART_DEFINES }}

      - name: Package IPA
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          IPA="openchat-${VERSION}-ios-unsigned.ipa"
          mkdir -p Payload
          cp -r "build/ios/iphoneos/Runner.app" Payload/
          ditto -c -k --keepParent Payload "$IPA"
          rm -rf Payload
          echo "IPA=${IPA}" >> "$GITHUB_ENV"

      - name: Upload to release
        run: gh release upload "${{ needs.version.outputs.release_tag }}" "${{ env.IPA }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  cleanup-old-assets:
    name: Clear previous release binaries
    needs: [version, build-android, build-windows, build-linux, build-macos, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Delete assets from older releases
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ needs.version.outputs.release_tag }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName --jq '.[].tagName' | while read -r tag; do
            [ "$tag" = "$CURRENT" ] && continue
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' | while read -r asset; do
              echo "Deleting $asset from $tag"
              gh release delete-asset "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --yes
            done
          done
