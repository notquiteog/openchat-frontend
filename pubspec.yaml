name: openchat
description: Open-source E2E encrypted messenger with PGP
version: 0.5.58+130
publish_to: 'none'

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase (push notifications — optional; requires flutterfire configure)
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0

  # PGP / cryptography
  openpgp:
    git:
      url: https://github.com/notquiteog/flutter-openpgp.git
      # v3.13.1 = hiddenRecipients (anonymous wildcard PKESKs) with the
      # CI-rebuilt binary set for every platform.
      ref: v3.13.1
  pointycastle: ^4.0.0
  cryptography: ^2.9.0
  crypto: ^3.0.7

  # Secure storage (Keychain / Keystore / Credential Manager)
  flutter_secure_storage: ^10.2.0

  # State management
  provider: ^6.1.5+1

  # Networking
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  dio: ^5.9.2

  # Local database (message cache)
  drift: ^2.34.0
  sqlite3: ^3.3.2

  # Storage
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.5

  # File / media
  image_picker: ^1.2.2
  file_selector: ^1.1.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0
  video_player: ^2.11.1
  mime: ^2.0.0
  image: ^4.8.0

  # P2P WebRTC — handles media, ICE, SDP negotiation.
  flutter_webrtc: 1.4.1

  # SFU for premium "Call with SFU" group calls. 1:1 and the default group path
  # stay on the P2P mesh above; LiveKit is an additional, premium-only option.
  livekit_client: 2.8.0

  # Call ringtone / connecting tones + voice-note playback
  just_audio: ^0.10.5
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9

  # Location-based features (live sharing)
  geolocator: ^14.0.2

  # QR identity verification
  pretty_qr_code: ^3.6.0
  mobile_scanner: ^7.2.0

  # iOS 26 Liquid Glass UI kit — shader-based refraction, physics animations
  liquid_glass_widgets: ^0.15.6

  # UI utilities
  intl: ^0.20.2
  uuid: ^4.5.3
  convert: ^3.1.2
  timeago: ^3.7.1

  # Biometric auth (key unlock + app lock)
  local_auth: ^3.0.1

  # Background WebSocket service — keeps the WS alive when the app is backgrounded.
  # Android requires a foreground service entry in AndroidManifest.xml;
  # see lib/services/background_ws_service.dart for the required native setup.
  flutter_background_service: ^5.0.0

  # Local OS notifications. No web implementation — usage is guarded by
  # platform in NotificationService; web falls back to in-app.
  flutter_local_notifications: 22.0.0
  timezone: ^0.11.0

  # Open Stripe checkout URLs in the system browser
  url_launcher: ^6.3.0
  html: ^0.15.6
  flutter_image_compress: ^2.4.0
  package_info_plus: 10.1.0
  window_manager: ^0.5.1
  tray_manager: ^0.5.3
  # Session-bus probe for org.kde.StatusNotifierWatcher before enabling
  # hide-to-tray on Linux (already in the graph via the Linux notification
  # plugin; pinned in dependency_overrides).
  dbus: 0.7.14
  app_badge_plus: ^1.3.1
  record: ^7.1.0
  permission_handler: ^12.0.3
  app_links: ^7.1.2

  # Outgoing share — share a message / media out to other apps via the OS sheet.
  # 13.x targets win32 ^6.x, matching our pinned win32 6.3.0 (11/12.x target
  # win32 5.5.3 and fail to compile against the 6.x OSVERSIONINFOEX API).
  share_plus: ^13.0.0

  # Inbound share — receive text shared from other apps (OS "Share to OpenChat").
  # Android only for now; iOS additionally needs a Share Extension + App Group.
  share_handler: ^0.0.25
  openmls:
    git:
      url: https://github.com/notquiteog/openmls_dart.git
      ref: openmls_frb-1.6.0
  socks5_proxy: ^2.1.1
  connectivity_plus: ^7.1.1
  image_cropper: ^12.2.1
  onnxruntime: ^1.4.1
  sherpa_onnx: ^1.13.2
  ffmpeg_kit_flutter_new_min: ^3.1.0
  google_mlkit_translation: ^0.13.1
  google_mlkit_language_id: ^0.13.1
  flutter_blue_ce:
    git:
      url: https://github.com/notquiteog/flutter_blue_ce.git
      ref: main
  ble_peripheral: ^2.4.0
  # Direct use: the 3D die needs Vector3 normals (same library Flutter's
  # Matrix4 comes from; exact version pinned in dependency_overrides).
  vector_math: ^2.4.0
  desktop_drop: ^0.7.1
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/stickers/
    - assets/sounds/
  shaders:
    - shaders/gold_sand.frag

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Pinned by flutter_test; declared so tests may import it directly.
  fake_async: ^1.3.0
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  drift_dev: ^2.34.0
  flutter_launcher_icons: ^0.14.1

dependency_overrides:
  # flutter_image_compress_common 1.0.6 still compiles obsolete AssetsLibrary
  # helpers, which Xcode rejects when the app targets iOS 26+. Keep this fork
  # until upstream publishes a Photos/ImageIO-only iOS implementation.
  flutter_image_compress_common:
    git:
      url: https://github.com/notquiteog/flutter_image_compress.git
      ref: flutter_image_compress_common-v1.0.6-ios26.1
      path: packages/flutter_image_compress_common
  # livekit_client 2.8.0 hard-pins flutter_webrtc 1.4.0, but we keep 1.4.1
  # (a patch over 1.4.0 — Dart-API compatible). Force 1.4.1 app-wide so the P2P
  # mesh and the LiveKit SFU share a single flutter_webrtc native plugin.
  flutter_webrtc: 1.4.1
  # Pinned to exact versions — keep in sync with the version table in the PR.
  _fe_analyzer_shared: 102.0.0
  analyzer: 13.2.0
  cli_util: 0.5.1
  dart_style: 3.1.9
  dbus: 0.7.14
  device_info_plus: 13.1.0
  device_info_plus_platform_interface: 8.1.0
  flutter_local_notifications_linux: 8.0.1
  flutter_local_notifications_platform_interface: 12.0.0
  flutter_local_notifications_web: 1.0.0
  flutter_local_notifications_windows: 3.1.0
  flutter_secure_storage_darwin: 0.4.0
  flutter_secure_storage_linux: 3.0.1
  flutter_secure_storage_windows: 4.2.2
  geolocator_linux: 0.2.5
  matcher: 0.12.20
  meta: 1.18.3
  package_info_plus_platform_interface: 4.1.0
  test_api: 0.7.12
  vector_math: 2.4.0
  win32: 6.3.0
  win32_registry: 3.0.3
  image: 4.9.1
  xml: 7.0.1

# App / launcher icons. Regenerate after changing the logo with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/images/logo.png"
  android: "launcher_icon"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#FFFFFF"
    theme_color: "#3D5AFE"
  windows:
    generate: true
    icon_size: 48
  macos:
    generate: true
